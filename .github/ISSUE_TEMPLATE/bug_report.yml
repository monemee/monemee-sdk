name: Bug report
description: Something in the SDK does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - monemee (CLI)
        - "@monemee/node"
        - "@monemee/react"
        - "@monemee/client"
        - monemee (Python)
        - GitHub Action
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version and runtime
      placeholder: "@monemee/node 0.1.0, Node 22, Express 4"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      description: Remove all secrets (mmapp_..., whsec_..., monemee_...) and license keys.
      render: js
