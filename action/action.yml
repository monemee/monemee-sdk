name: 'Monemee Release'
description: 'Upload a release file as the new version of your Monemee product. Existing buyers get it through their download links.'
author: 'Monemee'
branding:
  icon: 'upload-cloud'
  color: 'blue'
inputs:
  api-key:
    description: 'Monemee API key (monemee_...) from Settings > API keys, stored as a repository secret'
    required: true
  product-id:
    description: 'Your Monemee product ID'
    required: true
  file:
    description: 'Path to the file, for example dist/my-app.zip'
    required: true
  base-url:
    description: 'Monemee address (change only for testing)'
    required: false
    default: 'https://monemee.com'
outputs:
  module-id:
    description: 'ID of the updated file module'
  file-url:
    description: 'Stored file URL'
runs:
  using: 'node24'
  main: 'index.js'
